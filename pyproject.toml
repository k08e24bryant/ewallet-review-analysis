[project]
name = "ewallet-review-analysis"
version = "0.1.0"
description = "Sentiment classification and complaint topic discovery on Indonesian e-wallet Play Store reviews"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "bertopic>=0.17.4",
    "datasets>=5.0.1",
    "emoji>=2.16.0",
    "google-play-scraper>=1.2.7",
    "lingua-language-detector>=2.1.1",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.1.0",
    "stopwordsiso>=0.7.1",
    "torch>=2.14.1",
    "transformers>=5.18.0",
    "wandb>=0.30.0",
]

# PyTorch CUDA build matched to the local driver (nvidia-smi: driver 610.88, CUDA 13.3).
# cu132 is the newest PyTorch CUDA build that the driver supports.
[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132" }
