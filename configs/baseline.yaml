# Phase 4: TF-IDF + Logistic Regression baseline
seed: 42

splits_dir: data/processed/splits
text_col: model_text
target_col: weak_label
labels: [negative, neutral, positive]

features:
  word: {analyzer: word, ngram_range: [1, 2], sublinear_tf: true, lowercase: true}
  char: {analyzer: char_wb, ngram_range: [3, 5], sublinear_tf: true, lowercase: true}

model:
  class_weight: balanced
  max_iter: 3000
  solver: lbfgs

# Tuned on VAL macro-F1 only; gold is never read during tuning.
grid:
  C: [0.25, 0.5, 1.0, 2.0, 4.0]
  min_df: [2, 3, 5]          # applied to both word and char vectorizers

model_dir: models/baseline
tuning_report_path: reports/phase4_tuning.json

eval:
  config: configs/evaluate.yaml
  report_path: reports/phase4_baseline.json
  errors_path: reports/phase4_errors.csv
  n_errors: 40
  top_features: 20
  figures:
    comparison: phase4_complaint_detection.png
    confusion: phase4_confusion_tfidf.png
