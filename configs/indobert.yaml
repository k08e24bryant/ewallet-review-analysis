# Phase 5b/5c: IndoBERT fine-tuning (RTX 3060 Laptop, 6 GB VRAM)
seed: 42
model_name: indobenchmark/indobert-base-p1

splits_dir: data/processed/splits
text_col: model_text

# label schemes: see src/schemes.py
# spec_3class            weak_label: 1-2 negative, 3 neutral, 4-5 positive
# binary_drop_3star      1-2 negative, 4-5 non_negative; 3-star rows dropped
# binary_3star_negative  1-3 negative, 4-5 non_negative
label_scheme: spec_3class
# none | balanced (n / (k * n_c)) | sqrt-balanced (square root of balanced)
class_weights: balanced

max_length: 128               # 95th pct = 40 tokens; only 17 reviews exceed 128
dynamic_padding: true         # pad per batch to its longest sequence

training:
  num_train_epochs: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup: 0.06                # float < 1 = ratio of total steps (transformers 5)
  lr_scheduler_type: linear
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 64
  gradient_accumulation_steps: 2   # if OOM: batch 8, accumulation 4 (never lower max_length)
  fp16: true
  eval_strategy: steps
  eval_steps: 350             # ~4 evaluations per epoch (1,419 optimizer steps/epoch on full train)
  save_strategy: steps        # must match eval for load_best_model_at_end
  save_total_limit: 2
  save_only_model: true       # no optimizer state in checkpoints (disk)
  logging_steps: 50
  metric_for_best_model: macro_f1   # on VAL weak labels for the active scheme
  greater_is_better: true
  early_stopping_patience: 3        # evaluations without improvement
  dataloader_num_workers: 0         # Windows

output_root: models/indobert       # -> {output_root}/{label_scheme}/{class_weights}/
keep_checkpoints: false            # after training, keep only final/ (the best model) to save disk

wandb:
  project: ewallet-reviews
  entity: syarifsanad-institut-teknologi-sepuluh-nopember

smoke:
  train_rows: 200
  val_rows: 200
  num_train_epochs: 1
  eval_steps: 3               # exercise eval / save / load-best within the tiny run
  output_root: models/indobert/smoke
